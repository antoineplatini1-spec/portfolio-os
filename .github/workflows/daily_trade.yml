name: Daily Trading — Zentry

on:
  schedule:
    # 13h00 Paris été (CEST=UTC+2) / 12h00 Paris hiver (CET=UTC+1)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check requirements
        run: cat requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write email_config.json
        run: |
          mkdir -p data
          echo '${{ secrets.EMAIL_CONFIG_JSON }}' > data/email_config.json

      - name: Run daily_auto.py
        run: python daily_auto.py
        env:
          DATA_DIR: ${{ github.workspace }}/data
          TZ: America/New_York

      - name: Commit portfolio state
        run: |
          git config user.name  "Zentry Bot"
          git config user.email "bot@zentry.uk"
          git add data/portfolio_state.json data/momentum_state.json data/momentum_signals.jsonl data/daily_log.txt
          git diff --staged --quiet || git commit -m "auto: portfolio $(date +%Y-%m-%d)"
          git push
